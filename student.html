<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>三線学習システム</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
  <script src="supabase-config.js"></script>
  <style>
    body { font-family: 'Noto Sans JP', sans-serif; background: #F2F9F6; }
    .site-header { background: #fff; border-bottom: 2px solid #C8E8D8; }
    .tab-nav { background: #fff; border-bottom: 1px solid #e5e7eb; position: sticky; top: 0; z-index: 20; }
    .tab-btn { padding: 13px 20px; font-size: 14px; font-weight: 500; color: #6b7280; cursor: pointer; border-bottom: 3px solid transparent; transition: all .2s; white-space: nowrap; }
    .tab-btn.active { color: #7BBAA8; border-bottom-color: #7BBAA8; font-weight: 700; }
    .tab-btn:hover:not(.active) { color: #7BBAA8; background: #EDF7F4; }

    /* Task card */
    .task-card { background: #fff; border-radius: 14px; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.06); border: 2px solid transparent; transition: all .25s; }
    .task-card.done { background: #EDF9F5; border-color: #A8DDD0; }
    .task-card.highlight { border-color: #7BBAA8; box-shadow: 0 4px 18px rgba(123,186,168,.2); }

    /* Number badge */
    .task-num { width: 30px; height: 30px; min-width: 30px; border-radius: 50%; background: #7BBAA8; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; }
    .task-card.done .task-num { background: #5BA090; }

    /* Complete button */
    .kanryo-btn { background: #7BBAA8; color: #fff; border: none; border-radius: 20px; padding: 7px 18px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: 'Noto Sans JP', sans-serif; white-space: nowrap; transition: all .2s; }
    .kanryo-btn:hover { background: #6BAA98; box-shadow: 0 4px 12px rgba(123,186,168,.4); }
    .task-card.done .kanryo-btn { background: #D0EDE7; color: #2D7568; }

    /* Criteria box */
    .criteria-box { border-left: 3px solid #B8DDD4; padding: 8px 12px; margin-top: 10px; background: #F5FBF9; border-radius: 0 8px 8px 0; }
    .task-card.done .criteria-box { border-left-color: #A8DDD0; background: #EDF9F5; }

    /* Song pills */
    .song-pill { background: #fff; border: 2px solid #e5e7eb; border-radius: 20px; padding: 7px 16px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all .2s; color: #374151; }
    .song-pill.active { background: #7BBAA8; border-color: #7BBAA8; color: #fff; }
    .song-pill:hover:not(.active) { border-color: #7BBAA8; color: #7BBAA8; }

    /* Step circles */
    .step-circle { width: 30px; height: 30px; min-width: 30px; border-radius: 50%; border: 2px solid #d1d5db; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #9ca3af; cursor: pointer; background: none; padding: 0; transition: all .15s; }
    .step-circle:hover { border-color: #7BBAA8; color: #7BBAA8; transform: scale(1.15); }
    .step-circle.done { background: #7BBAA8; border-color: #7BBAA8; color: #fff; }
    .step-circle.done:hover { background: #5fa390; border-color: #5fa390; }

    /* Memo button */
    .memo-btn { background: transparent; border: 1px solid #e5e7eb; border-radius: 6px; padding: 4px 8px; font-size: 11px; color: #9ca3af; cursor: pointer; white-space: nowrap; transition: all .15s; }
    .memo-btn:hover { border-color: #7BBAA8; color: #7BBAA8; }
    .memo-btn.has-memo { background: #EDF9F5; border-color: #A8DDD0; color: #7BBAA8; }

    /* Learning points */
    .tips-box { background: #EDF9F5; border-radius: 16px; padding: 18px 20px; }

    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
    .modal-overlay.hidden { display: none !important; }
    .modal-box { background: #fff; border-radius: 16px; padding: 24px; width: 100%; max-width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
    textarea { font-family: 'Noto Sans JP', sans-serif; }

    /* Logout button */
    .logout-btn { display: flex; align-items: center; gap: 6px; background: #FEF2F2; color: #DC2626; border: 1px solid #FECACA; border-radius: 8px; padding: 6px 12px; font-size: 12px; font-weight: 600; cursor: pointer; font-family: 'Noto Sans JP', sans-serif; transition: background .2s; }
    .logout-btn:hover { background: #FEE2E2; }

    /* Achievement level circles */
    .level-circle { width:26px; height:26px; min-width:26px; border-radius:50%; border:2px solid #d1d5db; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:#9ca3af; cursor:pointer; background:none; padding:0; transition:all .15s; }
    .level-circle:hover { border-color:#7BBAA8; color:#7BBAA8; transform:scale(1.15); }
    .level-circle.done { background:#7BBAA8; border-color:#7BBAA8; color:#fff; }
    .level-circle.done:hover { background:#5fa390; border-color:#5fa390; }
    .level-circle.next { border-color:#7BBAA8; color:#7BBAA8; }
    .level-row { display:flex; align-items:flex-start; gap:8px; padding:5px 0; border-bottom:1px solid #f0f0f0; }
    .level-row:last-child { border-bottom:none; }
    .level-tag { background:#EDF9F5; color:#2D7568; border-radius:4px; padding:1px 7px; font-size:10px; font-weight:700; flex-shrink:0; margin-top:2px; white-space:nowrap; }
    .level-tag.done { background:#7BBAA8; color:#fff; }

    /* YouTube embed */
    .yt-wrap { margin-top:10px; border-radius:10px; overflow:hidden; background:#000; aspect-ratio:16/9; }
    .yt-wrap iframe { width:100%; height:100%; border:none; display:block; }
    .yt-link { display:flex; align-items:center; gap:8px; background:#FEF2F2; border-radius:10px; padding:10px 14px; text-decoration:none; color:#DC2626; font-size:13px; font-weight:600; margin-top:10px; }

    /* Practice bar */
    .practice-bar { background:#fff; border-bottom:1px solid #e5e7eb; }
    .practice-btn { background:#7BBAA8; color:#fff; border:none; border-radius:12px; padding:6px 14px; font-size:12px; font-weight:700; cursor:pointer; font-family:'Noto Sans JP',sans-serif; transition:all .2s; white-space:nowrap; }
    .practice-btn:hover:not(.done) { background:#6BAA98; }
    .practice-btn.done { background:#D0EDE7; color:#2D7568; cursor:default; }

    /* Badges */
    .badge-chip { display:inline-flex; align-items:center; gap:3px; background:#FFFBEB; border:1px solid #FCD34D; color:#92400E; border-radius:20px; padding:2px 9px; font-size:11px; font-weight:700; white-space:nowrap; }

    /* YouTube speed */
    .yt-speed-btn { background:#f3f4f6; border:1px solid #e5e7eb; border-radius:10px; padding:2px 8px; font-size:11px; font-weight:600; cursor:pointer; color:#6b7280; transition:all .15s; }
    .yt-speed-btn:hover { border-color:#7BBAA8; color:#7BBAA8; }
    .yt-speed-btn.active { background:#7BBAA8; border-color:#7BBAA8; color:#fff; }

    /* Teacher feedback */
    .teacher-fb { background:#FFFBEB; border-left:3px solid #F59E0B; border-radius:0 8px 8px 0; padding:7px 12px; margin-top:8px; }
  </style>
</head>
<body>

  <!-- ヘッダー -->
  <div class="site-header px-4 py-3">
    <div class="max-w-2xl mx-auto flex items-center justify-between">
      <div class="font-bold text-gray-800 text-base">三線学習システム</div>
      <div class="flex items-center gap-3">
        <div class="text-right">
          <div id="student-name" class="text-xs font-semibold text-gray-500"></div>
          <span id="grade-badge" class="inline-block bg-blue-100 text-blue-700 text-xs font-bold px-2 py-0.5 rounded-full mt-0.5"></span>
        </div>
        <button class="logout-btn" onclick="logout()">
          <i class="fas fa-sign-out-alt"></i>ログアウト
        </button>
      </div>
    </div>
  </div>

  <!-- 練習バー (Feature 3/4/5) -->
  <div class="practice-bar px-4 py-2">
    <div class="max-w-2xl mx-auto flex items-center gap-2 flex-wrap">
      <button id="practice-log-btn" class="practice-btn" onclick="logPractice()">
        <i class="fas fa-dumbbell mr-1"></i>今日練習した！
      </button>
      <div id="badges-area" class="flex gap-1.5 flex-wrap"></div>
      <div id="class-stats" class="ml-auto text-xs text-gray-400 hidden"></div>
    </div>
  </div>

  <!-- タブ -->
  <div class="tab-nav">
    <div class="max-w-2xl mx-auto flex">
      <button class="tab-btn active" id="tab-content" onclick="showTab('content')">
        <i class="fas fa-book-open mr-1.5"></i>基礎知識
      </button>
      <button class="tab-btn" id="tab-quiz" onclick="showTab('quiz')">
        <i class="fas fa-pencil-alt mr-1.5"></i>穴埋めクイズ
      </button>
      <button class="tab-btn" id="tab-grade" onclick="showTab('grade')">
        <i class="fas fa-graduation-cap mr-1.5"></i>学年別課題
      </button>
      <button class="tab-btn" id="tab-song" onclick="showTab('song')">
        <i class="fas fa-music mr-1.5"></i>曲別課題
      </button>
    </div>
  </div>

  <!-- 基礎知識 -->
  <div id="panel-content" class="max-w-2xl mx-auto">
    <div id="content-pills" class="flex gap-2 overflow-x-auto px-4 pt-3 pb-2 bg-white border-b border-gray-100 sticky top-[48px] z-10"></div>
    <div id="content-body" class="px-4 py-4">
      <div class="text-center py-12 text-gray-400"><i class="fas fa-spinner fa-spin text-2xl mb-2 block"></i><p class="text-sm">読み込み中...</p></div>
    </div>
  </div>

  <!-- 穴埋めクイズ -->
  <div id="panel-quiz" class="hidden max-w-2xl mx-auto">
    <div id="quiz-pills" class="flex gap-2 overflow-x-auto px-4 pt-3 pb-2 bg-white border-b border-gray-100 sticky top-[48px] z-10"></div>
    <div id="quiz-body" class="px-4 py-4">
      <div class="text-center py-12 text-gray-400"><i class="fas fa-spinner fa-spin text-2xl mb-2 block"></i><p class="text-sm">読み込み中...</p></div>
    </div>
  </div>

  <!-- 学年別課題 -->
  <div id="panel-grade" class="hidden max-w-2xl mx-auto px-4 py-4">
    <div id="grade-loading" class="text-center py-10 text-gray-400">
      <i class="fas fa-spinner fa-spin text-2xl mb-2 block"></i>
      <p class="text-sm">読み込み中...</p>
    </div>
    <div id="grade-tasks" class="hidden"></div>
    <div id="grade-empty" class="hidden text-center py-10 text-gray-400 text-sm">課題が登録されていません</div>
  </div>

  <!-- 曲別課題 -->
  <div id="panel-song" class="hidden max-w-2xl mx-auto px-4 py-4">
    <div id="song-loading" class="text-center py-10 text-gray-400">
      <i class="fas fa-spinner fa-spin text-2xl mb-2 block"></i>
      <p class="text-sm">読み込み中...</p>
    </div>
    <div id="song-content" class="hidden">
      <div id="song-pills" class="flex flex-wrap gap-2 mb-4"></div>
      <div id="song-task-area"></div>
    </div>
    <div id="song-empty" class="hidden text-center py-10 text-gray-400 text-sm">楽曲が登録されていません</div>
  </div>

  <!-- 学習のポイント（常時表示） -->
  <div class="max-w-2xl mx-auto px-4 pb-8 mt-2">
    <div class="tips-box">
      <div class="flex items-center gap-2 mb-3">
        <span class="text-xl">💡</span>
        <span class="font-bold text-indigo-800 text-sm">学習のポイント</span>
      </div>
      <ul class="space-y-2">
        <li class="text-xs text-indigo-700 flex gap-2"><span>•</span><span>各課題は順番に取り組むことをお勧めします</span></li>
        <li class="text-xs text-indigo-700 flex gap-2"><span>•</span><span>達成基準をしっかり読んで、目標を理解してから練習しましょう</span></li>
        <li class="text-xs text-indigo-700 flex gap-2"><span>•</span><span>分からないことがあれば、遠慮なく先生に質問してください</span></li>
        <li class="text-xs text-indigo-700 flex gap-2"><span>•</span><span>【完了】ボタンは、達成基準を満たしたと確信した時に押してください</span></li>
      </ul>
    </div>
  </div>

  <!-- メモモーダル -->
  <div id="memo-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <h3 class="font-bold text-gray-800 mb-0.5" id="memo-task-title">メモ</h3>
      <p class="text-xs text-gray-400 mb-3">自分だけのメモを残せます</p>
      <textarea id="memo-text" rows="4" class="w-full border-2 border-gray-200 rounded-xl p-3 text-sm resize-none focus:outline-none focus:border-indigo-400" placeholder="例: 弾き方のコツ、練習内容..."></textarea>
      <div class="flex gap-2 mt-3 justify-end">
        <button class="bg-gray-100 text-gray-700 border-none rounded-lg px-4 py-2 text-sm cursor-pointer hover:bg-gray-200 font-family-inherit" style="font-family:inherit" onclick="closeMemo()">キャンセル</button>
        <button class="bg-indigo-600 text-white border-none rounded-lg px-4 py-2 text-sm font-semibold cursor-pointer hover:bg-indigo-700" style="font-family:inherit" onclick="saveMemo()"><i class="fas fa-save mr-1"></i>保存</button>
      </div>
    </div>
  </div>

  <!-- 確認モーダル -->
  <div id="confirm-modal" class="modal-overlay hidden">
    <div class="modal-box text-center">
      <div class="text-4xl mb-3">🔄</div>
      <p class="font-semibold text-gray-800 mb-1" id="confirm-title">達成を取り消しますか？</p>
      <p class="text-sm text-gray-400 mb-5" id="confirm-sub">チェックを外します</p>
      <div class="flex gap-2">
        <button class="flex-1 bg-gray-100 text-gray-700 border-none rounded-xl py-2.5 text-sm cursor-pointer hover:bg-gray-200" style="font-family:inherit" onclick="closeConfirm()">キャンセル</button>
        <button class="flex-1 bg-red-500 text-white border-none rounded-xl py-2.5 text-sm font-semibold cursor-pointer hover:bg-red-600" style="font-family:inherit" onclick="confirmUncheck()">取り消す</button>
      </div>
    </div>
  </div>

  <script>
    let student     = null;
    let progressMap = {}; // taskId → { is_completed, memo, completed_level, yt_speed }
    let kotoTasks   = []; // { id, title, description, order_num, level_count, ... }
    let allSongs    = []; // { id, title, artist }
    let songCache   = {}; // songId → [ { id, title, description } ]
    let currentSongId  = null;
    let memoTarget     = null;
    let uncheckTarget  = null;
    let songTabLoaded  = false;
    let practiceLogs   = []; // DATE strings 'YYYY-MM-DD'
    let feedbackMap    = {}; // taskId → comment string

    // ---- INIT ----

    async function init() {
      student = JSON.parse(localStorage.getItem('currentUser') || 'null');
      if (!student || student.type !== 'student') { window.location.href = 'index.html'; return; }
      document.getElementById('student-name').textContent = `${student.grade}年${student.class}組 出席番号:${student.number}番`;
      document.getElementById('grade-badge').textContent  = `${student.grade}年生`;
      await Promise.all([loadProgress(), loadPracticeLogs(), loadClassStats(), loadFeedback()]);
      renderPracticeBar();
      loadContentTab();
      contentTabLoaded = true;
    }

    async function loadProgress() {
      const { data } = await db.from('student_progress')
        .select('task_db_id, is_completed, memo, completed_level, yt_speed')
        .eq('school_id', student.school_id)
        .eq('student_id', student.id);
      (data || []).forEach(r => {
        progressMap[r.task_db_id] = {
          is_completed: r.is_completed, memo: r.memo || '',
          completed_level: r.completed_level || 0, yt_speed: r.yt_speed || '1.0'
        };
      });
    }

    // ---- FEATURE 3: 練習ログ ----

    async function loadPracticeLogs() {
      const { data } = await db.from('practice_logs')
        .select('logged_at')
        .eq('school_id', student.school_id)
        .eq('student_id', student.id)
        .order('logged_at', { ascending: false });
      practiceLogs = (data || []).map(r => r.logged_at);
    }

    async function logPractice() {
      const today = new Date().toISOString().slice(0, 10);
      if (practiceLogs.includes(today)) return;
      const btn = document.getElementById('practice-log-btn');
      if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i>記録中...'; }
      await db.from('practice_logs').upsert(
        { school_id: student.school_id, student_id: student.id, logged_at: today },
        { onConflict: 'school_id,student_id,logged_at' }
      );
      practiceLogs = [today, ...practiceLogs];
      if (btn) btn.disabled = false;
      renderPracticeBar();
    }

    function getPracticeStreak() {
      if (!practiceLogs.length) return 0;
      const todayStr = new Date().toISOString().slice(0, 10);
      if (!practiceLogs.includes(todayStr)) return 0;
      const sorted = [...practiceLogs].sort().reverse();
      let streak = 0, expecting = todayStr;
      for (const d of sorted) {
        if (d !== expecting) break;
        streak++;
        const dt = new Date(expecting);
        dt.setDate(dt.getDate() - 1);
        expecting = dt.toISOString().slice(0, 10);
      }
      return streak;
    }

    // ---- FEATURE 5: クラス達成率 ----

    async function loadClassStats() {
      try {
        const { data } = await db.rpc('class_completion_stats', {
          p_school_id: student.school_id,
          p_grade: String(student.grade),
          p_class: String(student.class)
        });
        const el = document.getElementById('class-stats');
        if (el && data && data.total_students > 0) {
          el.textContent = `クラス達成率 ${data.rate}%（${data.total_students}人）`;
          el.classList.remove('hidden');
        }
      } catch (_) {}
    }

    // ---- FEATURE 4: バッジ ----

    function renderBadges() {
      const area = document.getElementById('badges-area');
      if (!area) return;
      const done   = Object.values(progressMap).filter(p => p.is_completed).length;
      const streak = getPracticeStreak();
      const badges = [];
      if (done >= 1)  badges.push('🎵 初達成');
      if (done >= 5)  badges.push('⭐ 5課題');
      if (done >= 10) badges.push('🌟 10課題');
      if (done >= 20) badges.push('🏅 20課題');
      if (streak >= 3) badges.push(`🔥 ${streak}日連続`);
      if (practiceLogs.length >= 10) badges.push('📅 10日練習');
      area.innerHTML = badges.map(b => `<span class="badge-chip">${b}</span>`).join('');
    }

    function renderPracticeBar() {
      const today = new Date().toISOString().slice(0, 10);
      const logged = practiceLogs.includes(today);
      const streak = getPracticeStreak();
      const btn = document.getElementById('practice-log-btn');
      if (btn) {
        if (logged) {
          btn.className = 'practice-btn done';
          btn.innerHTML = `<i class="fas fa-check mr-1"></i>本日練習済み${streak >= 2 ? ` 🔥${streak}日連続` : ''}`;
        } else {
          btn.className = 'practice-btn';
          btn.innerHTML = '<i class="fas fa-dumbbell mr-1"></i>今日練習した！';
        }
      }
      renderBadges();
    }

    // ---- FEATURE 1: 先生フィードバック（表示） ----

    async function loadFeedback() {
      const { data } = await db.from('teacher_feedback')
        .select('task_db_id, comment')
        .eq('school_id', student.school_id)
        .eq('student_id', student.id);
      (data || []).forEach(r => { if (r.comment) feedbackMap[r.task_db_id] = r.comment; });
    }

    // ---- FEATURE 6: YouTube速度メモ ----

    function buildSpeedHtml(taskId, currentSpeed) {
      const spd = currentSpeed || '1.0';
      return `<div class="flex items-center gap-2 mt-2 flex-wrap">
        <span class="text-xs text-gray-400 flex-shrink-0"><i class="fas fa-tachometer-alt mr-1"></i>速度メモ:</span>
        ${['0.5', '0.75', '1.0', '1.25'].map(s =>
          `<button class="yt-speed-btn${spd === s ? ' active' : ''}"
            onclick="saveYtSpeed('${taskId}','${s}')"
            data-task="${taskId}" data-speed="${s}">${s}×</button>`
        ).join('')}
      </div>`;
    }

    async function saveYtSpeed(taskId, speed) {
      if (!progressMap[taskId]) progressMap[taskId] = { is_completed: false, memo: '', completed_level: 0, yt_speed: '1.0' };
      progressMap[taskId].yt_speed = speed;
      await db.from('student_progress').upsert({
        school_id: student.school_id, student_id: student.id, task_db_id: taskId,
        is_completed: progressMap[taskId].is_completed,
        completed_level: progressMap[taskId].completed_level || 0,
        memo: progressMap[taskId].memo || '', yt_speed: speed,
        updated_at: new Date().toISOString()
      }, { onConflict: 'school_id,student_id,task_db_id' });
      document.querySelectorAll(`[data-task="${taskId}"].yt-speed-btn`).forEach(btn => {
        btn.className = `yt-speed-btn${btn.dataset.speed === speed ? ' active' : ''}`;
      });
    }

    // ---- GRADE TASKS ----

    async function loadGradeTasks() {
      const { data } = await db.from('koto_tasks')
        .select('id, title, description, order_num, level_count, level_1_text, level_2_text, level_3_text, youtube_url')
        .eq('school_id', student.school_id)
        .eq('is_active', true)
        .order('order_num');

      document.getElementById('grade-loading').classList.add('hidden');
      kotoTasks = data || [];

      if (!kotoTasks.length) {
        document.getElementById('grade-empty').classList.remove('hidden');
        return;
      }

      const container = document.getElementById('grade-tasks');
      kotoTasks.forEach((t, i) => container.appendChild(makeCard(t, i + 1)));
      container.classList.remove('hidden');
      initLazyYt();
      renderBadges(); // タスク数が確定したのでバッジ再計算
    }

    // ---- SONG TASKS ----

    async function loadSongTab() {
      if (songTabLoaded) return;
      songTabLoaded = true;

      const { data } = await db.from('songs')
        .select('id, title, artist')
        .eq('school_id', student.school_id)
        .eq('is_active', true)
        .order('order_num');

      document.getElementById('song-loading').classList.add('hidden');
      allSongs = data || [];

      if (!allSongs.length) {
        document.getElementById('song-empty').classList.remove('hidden');
        return;
      }

      const pillsEl = document.getElementById('song-pills');
      allSongs.forEach((s, i) => {

        btn.className = `song-pill${i === 0 ? ' active' : ''}`;

        btn.textContent = s.title;
        btn.onclick   = () => selectSong(s.id);
        pillsEl.appendChild(btn);

      document.getElementById('song-content').classList.remove('hidden');

    async function selectSong(songId) {
      currentSongId = songId;
      allSongs.forEach(s => {
        const p = document.getElementById(`pill-${s.id}`);
        if (p) p.className = `song-pill${s.id === songId ? ' active' : ''}`;
      });

      if (!songCache[songId]) {
        const { data } = await db.from('song_tasks')
          .select('id, title, description, order_num, level_count, level_1_text, level_2_text, level_3_text, youtube_url')
          .eq('song_id', songId)
          .eq('school_id', student.school_id)
          .order('order_num');
        songCache[songId] = data || [];
      }

      const tasks = songCache[songId];
      const song  = allSongs.find(s => s.id === songId);
      const done  = tasks.filter(t => progressMap[t.id]?.is_completed).length;

      const area = document.getElementById('song-task-area');
      area.innerHTML = '';

      // Song header + step circles
      const hdr = document.createElement('div');
      hdr.className = 'bg-white rounded-2xl p-4 mb-3 flex items-center gap-3';
      hdr.innerHTML = `
        <div class="text-2xl">🎵</div>
        <div class="flex-1 min-w-0">
          <div class="font-bold text-gray-800 truncate">${song.title}</div>
          <div class="text-xs text-gray-400 mt-0.5">${done}/${tasks.length} 課題クリア</div>
        </div>
        <div class="flex gap-1.5 flex-shrink-0">
          ${tasks.map((t, i) => `<button class="step-circle${progressMap[t.id]?.is_completed ? ' done' : ''}" onclick="document.getElementById('card-${t.id}')?.scrollIntoView({behavior:'smooth',block:'center'})" title="課題${i+1}へ">${i + 1}</button>`).join('')}
        </div>
      `;
      area.appendChild(hdr);

      if (!tasks.length) {
        area.innerHTML += '<p class="text-center text-sm text-gray-400 py-4">課題が登録されていません</p>';
        return;
      }

      tasks.forEach((t, i) => area.appendChild(makeCard(t, i + 1)));
      initLazyYt();
    }

    // ---- TASK CARD ----

    function makeCard(task, num) {
      const taskId = task.id;
      const prog   = progressMap[taskId] || { is_completed: false, memo: '', completed_level: 0 };
      const lc     = task.level_count || 1;
      const isDone = prog.is_completed;
      const cl     = prog.completed_level || 0;

      const el = document.createElement('div');
      el.className = `task-card${isDone ? ' done' : ''}`;
      el.id        = `card-${taskId}`;

      // Level circles
      let levelCirclesHtml = '';
      if (lc >= 2) {
        levelCirclesHtml = Array.from({length: lc}, (_, i) => {
          const lvl = i + 1;
          const cls = lvl <= cl ? 'done' : (lvl === cl + 1 && !isDone ? 'next' : '');
          return `<button class="level-circle ${cls}" onclick="setTaskLevelCircle('${taskId}',${lvl},${lc},${num})" title="Level ${lvl}">${lvl}</button>`;
        }).join('');
      }

      // Criteria / level rows
      let criteriaHtml = '';
      if (lc >= 2) {
        const texts = [task.level_1_text, task.level_2_text, task.level_3_text].slice(0, lc);
        criteriaHtml = `<div class="criteria-box" style="padding:6px 10px;">` +
          texts.map((txt, i) => {
            const done = (i + 1) <= cl;
            return `<div class="level-row">
              <span class="level-tag${done ? ' done' : ''}">Level.${i+1}</span>
              <span class="text-sm text-gray-700">${escH(txt) || '（未設定）'}</span>
            </div>`;
          }).join('') + '</div>';
      } else if (task.description) {
        criteriaHtml = `<div class="criteria-box"><div class="text-xs font-bold text-gray-500 mb-1">達成基準</div><div class="text-sm text-gray-700">${escH(task.description)}</div></div>`;
      }

      // YouTube
      const ytHtml = buildYtHtml(task.youtube_url);

      // Button label
      let btnLabel;
      if (isDone) {
        btnLabel = '<i class="fas fa-check mr-1"></i>済み';
      } else if (lc >= 2) {
        btnLabel = cl >= lc ? '完了' : `Level ${cl + 1} 達成`;
      } else {
        btnLabel = '完了';
      }

      const feedbackHtml = feedbackMap[taskId]
        ? `<div class="teacher-fb"><span class="text-xs font-bold text-amber-700"><i class="fas fa-comment-dots mr-1"></i>先生より: </span><span class="text-xs text-gray-700">${escH(feedbackMap[taskId])}</span></div>`
        : '';
      const speedHtml = task.youtube_url ? buildSpeedHtml(taskId, prog.yt_speed) : '';

      el.innerHTML = `
        <div class="flex items-center gap-3">
          <div class="task-num" id="tnum-${taskId}">${isDone ? '<i class="fas fa-check text-xs"></i>' : num}</div>
          <div class="flex-1 font-semibold text-gray-800 text-sm leading-snug">${escH(task.title)}</div>
          ${lc >= 2 ? `<div class="flex gap-1" id="lvlcirc-${taskId}">${levelCirclesHtml}</div>` : ''}
          <button class="memo-btn${prog.memo ? ' has-memo' : ''}" id="memo-btn-${taskId}">
            <i class="fas fa-sticky-note mr-0.5"></i>${prog.memo ? 'メモ有' : 'メモ'}
          </button>
          <button class="kanryo-btn" id="done-btn-${taskId}">${btnLabel}</button>
        </div>
        ${criteriaHtml}
        ${feedbackHtml}
        ${ytHtml}
        ${speedHtml}
      `;

      el.querySelector(`#memo-btn-${taskId}`).addEventListener('click', e => {
        e.stopPropagation();
        openMemo(taskId, task.title);
      });
      el.querySelector(`#done-btn-${taskId}`).addEventListener('click', () => toggleTask(taskId, num, lc));
      return el;
    }

    // ---- YOUTUBE HELPERS ----

    function isSlowNetwork() {
      const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
      if (!conn) return false;
      return conn.saveData || conn.effectiveType === '2g' || conn.effectiveType === 'slow-2g';
    }

    function extractYtId(url) {
      if (!url) return null;
      const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|shorts\/))([a-zA-Z0-9_-]{11})/);
      return m ? m[1] : null;
    }

    function buildYtHtml(url) {
      if (!url) return '';
      const id = extractYtId(url);
      if (!id) return `<a href="${escH(url)}" target="_blank" rel="noopener" class="yt-link"><i class="fab fa-youtube mr-2"></i>動画を見る（外部リンク）</a>`;
      if (isSlowNetwork()) {
        return `<a href="https://www.youtube.com/watch?v=${id}" target="_blank" rel="noopener" class="yt-link">
          <i class="fab fa-youtube mr-2"></i>動画を見る（電波が弱いため外部リンクで開きます）</a>`;
      }
      return `<div class="yt-wrap">
        <iframe data-src="https://www.youtube.com/embed/${id}?rel=0" frameborder="0" allowfullscreen
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          class="lazy-yt" style="width:100%;height:100%;border:none;display:block"></iframe>
      </div>`;
    }

    function initLazyYt() {
      if (!('IntersectionObserver' in window)) {
        document.querySelectorAll('.lazy-yt').forEach(el => { if (el.dataset.src) el.src = el.dataset.src; });
        return;
      }
      const obs = new IntersectionObserver(entries => {
        entries.forEach(e => {
          if (e.isIntersecting && e.target.dataset.src) {
            e.target.src = e.target.dataset.src;
            delete e.target.dataset.src;
            obs.unobserve(e.target);
          }
        });
      }, { rootMargin: '100px' });
      document.querySelectorAll('.lazy-yt').forEach(el => { if (el.dataset.src) obs.observe(el); });
    }

    function refreshCard(taskId, num) {
      const el = document.getElementById(`card-${taskId}`);
      if (!el) return;
      const prog = progressMap[taskId];
      el.className = `task-card${prog.is_completed ? ' done' : ''}`;
      const tnumEl = document.getElementById(`tnum-${taskId}`);
      if (tnumEl) tnumEl.innerHTML = prog.is_completed ? '<i class="fas fa-check text-xs"></i>' : num;
      const doneBtn = document.getElementById(`done-btn-${taskId}`);
      if (doneBtn) doneBtn.innerHTML = prog.is_completed ? '<i class="fas fa-check mr-1"></i>済み' : '完了';
      const memoBtn = document.getElementById(`memo-btn-${taskId}`);
      if (memoBtn) {
        memoBtn.className = `memo-btn${prog.memo ? ' has-memo' : ''}`;
        memoBtn.innerHTML = `<i class="fas fa-sticky-note mr-0.5"></i>${prog.memo ? 'メモ有' : 'メモ'}`;
      }
    }

    // ---- TOGGLE / SAVE ----

    async function toggleTask(taskId, num, levelCount = 1) {
      const prog = progressMap[taskId] || { is_completed: false, memo: '', completed_level: 0 };
      if (prog.is_completed) {
        uncheckTarget = { taskId, num, levelCount };
        document.getElementById('confirm-title').textContent = '達成を取り消しますか？';
        document.getElementById('confirm-sub').textContent   = 'チェックを外します';
        document.getElementById('confirm-modal').classList.remove('hidden');
        return;
      }
      if (levelCount >= 2) {
        const cl = prog.completed_level || 0;
        if (cl >= levelCount) {
          // 円ボタンで全レベル済み → 正式に完了確定
          await setLevelProgress(taskId, num, cl, true, levelCount);
        } else {
          const newLevel = cl + 1;
          const newDone  = newLevel >= levelCount;
          await setLevelProgress(taskId, num, newLevel, newDone, levelCount);
        }
      } else {
        await setCompleted(taskId, num, true);
        const card = document.getElementById(`card-${taskId}`);
        if (card) { card.classList.add('highlight'); setTimeout(() => card.classList.remove('highlight'), 1200); }
      }
    }

    async function setLevelProgress(taskId, num, newLevel, isDone, levelCount) {
      if (!progressMap[taskId]) progressMap[taskId] = { is_completed: false, memo: '', completed_level: 0 };
      progressMap[taskId].completed_level = newLevel;
      progressMap[taskId].is_completed    = isDone;

      await db.from('student_progress').upsert({
        school_id: student.school_id, student_id: student.id,
        task_db_id: taskId, is_completed: isDone,
        completed_level: newLevel,
        memo: progressMap[taskId].memo, updated_at: new Date().toISOString()
      }, { onConflict: 'school_id,student_id,task_db_id' });

      // Refresh card UI
      const el = document.getElementById(`card-${taskId}`);
      if (el) {
        el.className = `task-card${isDone ? ' done' : ''}`;
        const tnumEl  = document.getElementById(`tnum-${taskId}`);
        const btnEl   = document.getElementById(`done-btn-${taskId}`);
        const circEl  = document.getElementById(`lvlcirc-${taskId}`);
        if (tnumEl) tnumEl.innerHTML = isDone ? '<i class="fas fa-check text-xs"></i>' : num;
        if (btnEl)  btnEl.innerHTML  = isDone ? '<i class="fas fa-check mr-1"></i>済み' : (newLevel >= levelCount ? '完了' : `Level ${newLevel + 1} 達成`);
        if (circEl) circEl.innerHTML = Array.from({length: levelCount}, (_, i) => {
          const lvl = i + 1;
          const cls = lvl <= newLevel ? 'done' : (lvl === newLevel + 1 && !isDone ? 'next' : '');
          return `<button class="level-circle ${cls}" onclick="setTaskLevelCircle('${taskId}',${lvl},${levelCount},${num})" title="Level ${lvl}">${lvl}</button>`;
        }).join('');
        // Update level tag styles
        el.querySelectorAll('.level-tag').forEach((tag, i) => {
          if (i + 1 <= newLevel) tag.classList.add('done'); else tag.classList.remove('done');
        });

        if (isDone) {
          el.classList.add('highlight');
          setTimeout(() => el.classList.remove('highlight'), 1200);
          if (newLevel >= 3 || newLevel >= levelCount) {
            setTimeout(() => confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } }), 300);
          }
        }
      }

      // Refresh song header if in song tab
      if (currentSongId && songCache[currentSongId]?.some(t => t.id === taskId)) {
        const tasks = songCache[currentSongId];
        const done  = tasks.filter(t => progressMap[t.id]?.is_completed).length;
        const hdr   = document.getElementById('song-task-area')?.querySelector('.bg-white');
        if (hdr) {
          hdr.querySelector('.text-xs').textContent = `${done}/${tasks.length} 課題クリア`;
          const circles = hdr.querySelectorAll('.step-circle');
          tasks.forEach((t, i) => {
            if (circles[i]) circles[i].className = `step-circle${progressMap[t.id]?.is_completed ? ' done' : ''}`;
          });
        }
      }
    }

    async function setTaskLevelCircle(taskId, targetLevel, levelCount, num) {
      const prog = progressMap[taskId] || { is_completed: false, completed_level: 0 };
      if (prog.is_completed) return; // 完了済みは変更不可
      const cl = prog.completed_level || 0;
      if (targetLevel > cl) {
        // 前進：is_completed は絶対に立てない（達成ボタン専用）
        await setLevelProgress(taskId, num, targetLevel, false, levelCount);
      } else {
        // すでに達成済み → ロールバック確認
        uncheckTarget = { taskId, num, levelCount, rollbackTo: targetLevel - 1 };
        const rb = targetLevel - 1;
        document.getElementById('confirm-title').textContent = rb === 0 ? '達成を取り消しますか？' : `Level ${targetLevel} を取り消しますか？`;
        document.getElementById('confirm-sub').textContent   = rb === 0 ? 'このレベルの達成をリセットします' : `Level ${rb} までの達成に戻します`;
        document.getElementById('confirm-modal').classList.remove('hidden');
      }
    }

    async function setTaskLevel(taskId, targetLevel, levelCount, num) {
      const prog = progressMap[taskId] || { is_completed: false, completed_level: 0 };
      const cl = prog.completed_level || 0;
      if (targetLevel > cl) {
        // 前進（スキップも含む）
        const isDone = targetLevel >= levelCount;
        await setLevelProgress(taskId, num, targetLevel, isDone, levelCount);
      } else {
        // すでに達成済み → 1つ前のレベルに戻す確認
        uncheckTarget = { taskId, num, levelCount, rollbackTo: targetLevel - 1 };
        const rb = targetLevel - 1;
        document.getElementById('confirm-title').textContent = rb === 0 ? '達成を取り消しますか？' : `Level ${targetLevel} を取り消しますか？`;
        document.getElementById('confirm-sub').textContent   = rb === 0 ? 'このレベルの達成をリセットします' : `Level ${rb} までの達成に戻します`;
        document.getElementById('confirm-modal').classList.remove('hidden');
      }
    }

    async function confirmUncheck() {
      closeConfirm();
      if (!uncheckTarget) return;
      const { taskId, num, levelCount, rollbackTo } = uncheckTarget;
      uncheckTarget = null;
      if ((levelCount || 1) >= 2) {
        const level = rollbackTo ?? 0;
        await setLevelProgress(taskId, num, level, false, levelCount);
      } else {
        await setCompleted(taskId, num, false);
      }
    }
    function closeConfirm() { document.getElementById('confirm-modal').classList.add('hidden'); }

    async function setCompleted(taskId, num, val) {
      if (!progressMap[taskId]) progressMap[taskId] = { is_completed: false, memo: '' };
      progressMap[taskId].is_completed = val;

      await db.from('student_progress').upsert({
        school_id: student.school_id, student_id: student.id,
        task_db_id: taskId, is_completed: val,
        memo: progressMap[taskId].memo, updated_at: new Date().toISOString()
      }, { onConflict: 'school_id,student_id,task_db_id' });

      refreshCard(taskId, num);

      // refresh song header if in song tab
      if (currentSongId && songCache[currentSongId]?.some(t => t.id === taskId)) {
        const tasks = songCache[currentSongId];
        const done  = tasks.filter(t => progressMap[t.id]?.is_completed).length;
        const song  = allSongs.find(s => s.id === currentSongId);
        const hdr   = document.getElementById('song-task-area')?.querySelector('.bg-white');
        if (hdr) {
          hdr.querySelector('.text-xs').textContent = `${done}/${tasks.length} 課題クリア`;
          const circles = hdr.querySelectorAll('.step-circle');
          tasks.forEach((t, i) => {
            if (circles[i]) circles[i].className = `step-circle${progressMap[t.id]?.is_completed ? ' done' : ''}`;
          });
        }
      }

      // confetti if all done
      const allIds = [...kotoTasks, ...Object.values(songCache).flat()].map(t => t.id);
      if (val && allIds.every(id => progressMap[id]?.is_completed)) {
        setTimeout(() => confetti({ particleCount: 200, spread: 80, origin: { y: 0.5 } }), 300);
      }
    }

    // ---- MEMO ----

    function openMemo(taskId, title) {
      memoTarget = { taskId, title };
      document.getElementById('memo-task-title').textContent = title;
      document.getElementById('memo-text').value = progressMap[taskId]?.memo || '';
      document.getElementById('memo-modal').classList.remove('hidden');
    }
    function closeMemo() { document.getElementById('memo-modal').classList.add('hidden'); memoTarget = null; }

    async function saveMemo() {
      if (!memoTarget) return;
      const { taskId } = memoTarget;
      const memo = document.getElementById('memo-text').value.trim();
      if (!progressMap[taskId]) progressMap[taskId] = { is_completed: false, memo: '' };
      progressMap[taskId].memo = memo;

      await db.from('student_progress').upsert({
        school_id: student.school_id, student_id: student.id,
        task_db_id: taskId, is_completed: progressMap[taskId].is_completed,
        memo, updated_at: new Date().toISOString()
      }, { onConflict: 'school_id,student_id,task_db_id' });

      const koto = kotoTasks.find(t => t.id === taskId);
      const num  = koto ? kotoTasks.indexOf(koto) + 1
        : (songCache[currentSongId]?.findIndex(t => t.id === taskId) ?? -1) + 1;
      if (num > 0) refreshCard(taskId, num);
      closeMemo();
    }

    // ---- TABS ----

    let contentTabLoaded = false;
    let quizTabLoaded    = false;
    let gradeTabLoaded   = false;

    let contentTopics          = [];
    let quizTopics             = [];
    let currentContentTopicId  = null;
    let currentQuizTopicId     = null;

    function showTab(tab) {
      ['content','quiz','grade','song'].forEach(t => {
        document.getElementById(`panel-${t}`).classList.toggle('hidden', t !== tab);
        document.getElementById(`tab-${t}`).className = `tab-btn${t === tab ? ' active' : ''}`;
      });
      if (tab === 'content' && !contentTabLoaded) { contentTabLoaded = true; loadContentTab(); }
      if (tab === 'quiz'    && !quizTabLoaded)    { quizTabLoaded    = true; loadQuizTab(); }
      if (tab === 'grade'   && !gradeTabLoaded)   { gradeTabLoaded   = true; loadGradeTasks(); }
      if (tab === 'song'    && !songTabLoaded)    loadSongTab();
    }

    // ---- 基礎知識タブ ----

    async function loadContentTab() {
      const { data } = await db.from('study_topics')
        .select('*').eq('school_id', student.school_id)
        .eq('is_active', true).eq('topic_type', 'content').order('order_num');
      contentTopics = data || [];
      const pillsEl = document.getElementById('content-pills');
      const bodyEl  = document.getElementById('content-body');

      document.getElementById('content-pills').innerHTML = contentTopics.map(t => `
        <button class="song-pill flex-shrink-0${t.id === currentContentTopicId ? ' active' : ''}"
                onclick="selectContentTopic('${t.id}')">
          ${escH(t.icon || '📚')} ${escH(t.title)}
        </button>`).join('');
    }

    async function selectContentTopic(topicId) {
      currentContentTopicId = topicId;
      renderContentPills();
      const el = document.getElementById('content-body');
      el.innerHTML = '<p class="text-gray-400 text-sm text-center py-12">読み込み中...</p>';

    // ---- 穴埋めクイズタブ ----

    async function loadQuizTab() {
      const { data } = await db.from('study_topics')
        .select('*').eq('school_id', student.school_id)
        .eq('is_active', true).eq('topic_type', 'quiz').order('order_num');
      quizTopics = data || [];
      const pillsEl = document.getElementById('quiz-pills');
      const bodyEl  = document.getElementById('quiz-body');
      if (!quizTopics.length) {

        bodyEl.innerHTML = '<p class="text-gray-400 text-sm text-center py-12">穴埋めクイズがありません</p>';

      }

      renderQuizPills();
      await selectQuizTopic(quizTopics[0].id);
    }

    function renderQuizPills() {
      document.getElementById('quiz-pills').innerHTML = quizTopics.map(t => `
        <button class="song-pill flex-shrink-0${t.id === currentQuizTopicId ? ' active' : ''}"
                onclick="selectQuizTopic('${t.id}')">
          ${escH(t.icon || '🎵')} ${escH(t.title)}
        </button>`).join('');
    }

    async function selectQuizTopic(topicId) {
      currentQuizTopicId = topicId;
      renderQuizPills();
      const el = document.getElementById('quiz-body');
      el.innerHTML = '<p class="text-gray-400 text-sm text-center py-12">読み込み中...</p>';
      const topic = quizTopics.find(t => t.id === topicId);

    }

    // ---- STUDY (shared rendering) ----

    function escH(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    function mediaHtml(url, caption) {
      if (!url) return '';
      const m = url.match(/\/file\/d\/([^\/\?]+)/);
      const src = m ? `https://drive.google.com/file/d/${m[1]}/preview` : url;
      const tag = m
        ? `<iframe src="${escH(src)}" class="w-full rounded-xl" style="height:260px;border:1px solid #e5e7eb" allowfullscreen></iframe>`
        : `<img src="${escH(src)}" alt="${escH(caption)}" class="w-full rounded-xl object-contain max-h-64">`;
      return `<div class="my-3">${tag}${caption?`<p class="text-xs text-center text-gray-400 mt-1">${escH(caption)}</p>`:''}</div>`;
    }

    async function renderContentTopic(topicId, title, el) {
      const { data } = await db.from('study_sections')
        .select('*').eq('topic_id', topicId).order('order_num');
      const visible = (data || []).filter(s => s.is_visible !== false);
      if (!visible.length) { el.innerHTML = '<p class="text-gray-400 text-sm">コンテンツがまだありません</p>'; return; }
      el.innerHTML = `<h2 class="text-lg font-bold text-gray-800 mb-4">${escH(title)}</h2>` +
        visible.map(s => `
          <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 mb-4">
            <div class="flex items-center gap-2 mb-2">
              <div class="w-1 h-5 rounded-full bg-teal-500"></div>
              <h3 class="font-bold text-gray-800 text-sm">${escH(s.title)}</h3>
            </div>
            ${s.body ? `<p class="text-sm text-gray-700 leading-relaxed whitespace-pre-wrap mb-2">${escH(s.body)}</p>` : ''}
            ${mediaHtml(s.image_url, s.image_caption)}
            ${s.youtube_url ? buildYtHtml(s.youtube_url) : ''}
          </div>`).join('');
      initLazyYt();
    }

    async function renderQuizTopic(topicId, title, el) {
      const { data: sets } = await db.from('quiz_sets')
        .select('*').eq('topic_id', topicId).order('order_num');
      if (!sets?.length) { el.innerHTML = '<p class="text-gray-400 text-sm">クイズがまだありません</p>'; return; }

      // 全問題を取得
      const allQids = [];
      for (const s of sets) {
        const { data: qs } = await db.from('quiz_questions').select('*').eq('quiz_set_id', s.id).order('order_num');
        s._questions = qs || [];
        s._questions.forEach(q => allQids.push(q.id));
      }

      // 回答履歴取得
      const { data: answers } = allQids.length
        ? await db.from('quiz_answers').select('question_id, is_correct')
            .eq('school_id', student.school_id).eq('student_id', student.id).in('question_id', allQids)
        : { data: [] };
      const answerMap = {};
      (answers||[]).forEach(a => { answerMap[a.question_id] = a.is_correct; });

      const totalQ   = allQids.length;
      const correctN = Object.values(answerMap).filter(Boolean).length;

      el.innerHTML = `
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 mb-4">
          <div class="flex items-center justify-between">
            <h2 class="font-bold text-gray-800">${escH(title)}</h2>
            <span class="text-teal-600 font-bold text-sm" id="quiz-score">${correctN}/${totalQ} 問正解</span>
          </div>
          <p class="text-xs text-gray-400 mt-1">空欄に入る言葉を入力して「採点」を押しましょう</p>
        </div>` +
        sets.map(s => `
          <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 mb-4">
            <div class="flex items-center gap-2 mb-3">
              <div class="w-1 h-5 rounded-full bg-teal-500"></div>
              <h3 class="font-bold text-gray-800 text-sm">${escH(s.title)}</h3>
            </div>
            ${mediaHtml(s.image_url, s.image_caption)}
            <div class="space-y-3 mt-2">
              ${s._questions.map(q => {
                const prev = answerMap[q.id];
                const borderCls = prev === true ? 'border-green-400' : prev === false ? 'border-red-300' : 'border-gray-200';
                const iconHtml  = prev === true ? '<i class="fas fa-check-circle text-green-500 ml-1"></i>' : prev === false ? '<i class="fas fa-times-circle text-red-400 ml-1"></i>' : '';
                return `
                  <div class="flex items-center gap-2">
                    <label class="text-sm text-gray-700 flex-1">${escH(q.question_text)}${iconHtml}</label>
                    <input id="qi-${q.id}" type="text" class="border-2 ${borderCls} rounded-lg px-3 py-1.5 text-sm w-32 focus:outline-none focus:border-teal-400"
                           placeholder="入力" ${prev === true ? 'disabled value="✓正解"' : ''}>
                    ${prev !== true ? `<button onclick="gradeQuestion('${q.id}','${escH(q.correct_answer)}','${escH(q.hint)}','${escH(q.alt_answers||'')}')"
                      class="bg-teal-500 text-white text-xs font-bold px-3 py-1.5 rounded-lg hover:bg-teal-600 whitespace-nowrap">採点</button>` : ''}
                    ${q.hint && prev !== true ? `<button onclick="showHint('${escH(q.hint)}')" class="text-gray-300 hover:text-gray-500"><i class="fas fa-lightbulb"></i></button>` : ''}
                  </div>`;
              }).join('')}
            </div>
          </div>`).join('');
    }

    function normalizeAns(s) {
      return (s || '').trim()
        .replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60))
        .replace(/[Ａ-Ｚａ-ｚ０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
        .replace(/　/g, ' ').replace(/\s+/g, '').toLowerCase();
    }

    async function gradeQuestion(questionId, correctAnswer, hint, altAnswers) {
      const input = document.getElementById(`qi-${questionId}`);
      if (!input) return;
      const val = input.value.trim();
      if (!val) { input.focus(); return; }
      const allAnswers = [correctAnswer, ...(altAnswers ? altAnswers.split(',') : [])];
      const isCorrect  = allAnswers.some(a => normalizeAns(val) === normalizeAns(a));

      await db.from('quiz_answers').upsert({
        school_id: student.school_id, student_id: student.id,
        question_id: questionId, is_correct: isCorrect,
        answered_at: new Date().toISOString()
      }, { onConflict: 'school_id,student_id,question_id' });

      if (isCorrect) {
        input.disabled = true;
        input.value = '✓正解';
        input.className = input.className.replace(/border-\w+-\d+/g, '') + ' border-green-400 bg-green-50';
      } else {
        input.className = input.className.replace(/border-\w+-\d+/g, '') + ' border-red-300';
        input.select();
        if (hint) showHint(hint);
      }
      // スコア更新
      const scoreEl = document.getElementById('quiz-score');
      if (scoreEl) {
        const all    = document.querySelectorAll('[id^="qi-"]');
        const doneN  = document.querySelectorAll('[id^="qi-"][disabled]').length;
        scoreEl.textContent = `${doneN}/${all.length} 問正解`;
      }
    }

    function showHint(hint) {
      alert(`💡 ヒント: ${hint}`);
    }

    function logout() {
      localStorage.removeItem('currentUser');
      localStorage.removeItem('userType');
      window.location.href = `index.html${student?.school_id ? '?school=' + student.school_id : ''}`;
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
